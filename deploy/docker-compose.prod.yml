services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-eduscout}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD en deploy/.env}
      POSTGRES_DB: ${DATABASE_NAME:-eduscout}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-eduscout} -d ${DATABASE_NAME:-eduscout}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/bguzmanm/eduscout-back:latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-eduscout}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-eduscout}
      SCRAPING_CRON_ENABLED: ${SCRAPING_CRON_ENABLED:-false}
      TZ: America/Santiago
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/bguzmanm/eduscout-front:latest}
    restart: always
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  certbot_www:
  certbot_certs: