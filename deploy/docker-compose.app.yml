services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/bguzmanm/eduscout-back:latest}
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DATABASE_USER:-eduscout}:${DATABASE_PASSWORD}@10.0.0.45:5432/${DATABASE_NAME:-eduscout}
      SCRAPING_CRON_ENABLED: ${SCRAPING_CRON_ENABLED:-false}
      TZ: America/Santiago
      NODE_OPTIONS: --max-old-space-size=256
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en deploy/.env}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?Defina ADMIN_TOKEN_SECRET en deploy/.env}
      ADMIN_TOKEN_TTL_MS: ${ADMIN_TOKEN_TTL_MS:-7200000}
      CANDIDATE_TOKEN_SECRET: ${CANDIDATE_TOKEN_SECRET:?Defina CANDIDATE_TOKEN_SECRET en deploy/.env}
      CANDIDATE_TOKEN_TTL_MS: ${CANDIDATE_TOKEN_TTL_MS:-604800000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-EduScout <no-reply@eduscout.cl>}
      FRONTEND_URL: ${FRONTEND_URL:-https://eduscout.cl}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/bguzmanm/eduscout-front:latest}
    restart: always
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Set mínimo que nginx necesita para: preparar cache/temp (CHOWN/FOWNER),
      # spawnear workers como uid uid 101 (SETGID/SETUID) y ligar 80/443
      # (NET_BIND_SERVICE). Se descartan el resto de capabilities.
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    restart: "no"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - internal

networks:
  internal:

volumes:
  certbot_www:
  certbot_certs: