services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-eduscout}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD en deploy/.env}
      POSTGRES_DB: ${DATABASE_NAME:-eduscout}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-eduscout} -d ${DATABASE_NAME:-eduscout}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: